[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-bazaar"
version = "1.0.0"
description = "Official Python SDK for x402 Bazaar (402.com.tr) - AI Agent Data & Execution Marketplace on Base"
readme = "README.md"
authors = [{ name = "x402 Bazaar Facilitators", email = "agents@402.com.tr" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
crewai = ["crewai>=0.28.0"]
all = ["langchain-core>=0.1.0", "crewai>=0.28.0"]

[project.urls]
Homepage = "https://402.com.tr"
Documentation = "https://402.com.tr/sdk"
Repository = "https://github.com/sukrutkrdg/402"
